<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Community Calendar</title>
  
  <!-- FullCalendar CSS & JS -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* Mobile Calendar Layout Optimizations */
    @media (max-width: 767px) {
      .fc .fc-toolbar {
        flex-direction: column;
        gap: 0.4rem;
        margin-bottom: 0.4rem !important;
      }
      .fc .fc-toolbar-title {
        font-size: 1rem !important;
      }
      .fc .fc-button {
        padding: 0.2rem 0.4rem !important;
        font-size: 0.7rem !important;
      }
      .fc-daygrid-day-frame {
        min-height: 48px !important;
        padding: 1px !important;
        cursor: pointer;
      }
      .fc-daygrid-day-number {
        font-size: 0.75rem !important;
        padding: 2px !important;
        font-weight: 600;
      }
      .fc-event {
        font-size: 0.65rem !important;
        padding: 1px 2px !important;
        border-radius: 3px !important;
        pointer-events: none;
      }
      .fc-col-header-cell-cushion {
        font-size: 0.7rem !important;
        padding: 2px !important;
      }
    }
  </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-1 sm:p-4">

  <script>
    // YOUR GOOGLE CLOUD RUN TRIGGER URL
    const API_BASE_URL = "https://discord-events-260794370354.us-central1.run.app";
  </script>

  <!-- Header -->
  <div class="max-w-7xl mx-auto flex justify-between items-center mb-3 px-2">
    <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-white">Community Calendar</h1>
    <button onclick="openCreateModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded-lg text-xs sm:text-sm font-medium shadow transition">
      + Create Event
    </button>
  </div>

  <!-- Calendar Container -->
  <div class="max-w-7xl mx-auto bg-gray-800 p-2 sm:p-4 rounded-xl border border-gray-700 shadow-2xl">
    <div id="calendar"></div>
  </div>

  <!-- DAY OVERVIEW MODAL (Step 1) -->
  <div id="dayModal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-3 z-50">
    <div class="bg-gray-800 p-5 rounded-xl max-w-md w-full border border-gray-700 shadow-xl space-y-4">
      <div class="flex justify-between items-center border-b border-gray-700 pb-2">
        <h2 id="dayModalTitle" class="text-lg font-bold text-white"></h2>
        <button onclick="closeModal('dayModal')" class="text-gray-400 hover:text-white text-xl font-bold">&times;</button>
      </div>
      
      <div id="dayEventsList" class="space-y-2 max-h-60 overflow-y-auto pr-1"></div>

      <div class="flex gap-2 pt-2">
        <button onclick="openCreateModalFromDay()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-2 rounded-lg text-xs sm:text-sm font-medium transition">
          + Add Event to This Day
        </button>
        <button onclick="closeModal('dayModal')" class="w-1/2 bg-gray-700 hover:bg-gray-600 text-gray-200 py-2 rounded-lg text-xs sm:text-sm transition">
          Close
        </button>
      </div>
    </div>
  </div>

  <!-- EVENT DETAILS / RSVP MODAL (Step 2) -->
  <div id="eventModal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-3 z-50">
    <div class="bg-gray-800 p-5 rounded-xl max-w-md w-full border border-gray-700 shadow-xl space-y-4">
      <h2 id="modalTitle" class="text-lg sm:text-xl font-bold text-white"></h2>
      <p id="modalLocation" class="text-xs text-indigo-400 font-semibold uppercase tracking-wider"></p>
      
      <div id="modalDescription" class="text-gray-300 text-sm whitespace-pre-wrap break-words max-h-52 overflow-y-auto pr-2 bg-gray-900/50 p-3 rounded-lg border border-gray-700/50"></div>
      
      <div class="pt-1 space-y-3">
        <button id="rsvpBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2 rounded-lg transition shadow text-sm">
          Open in Discord
        </button>

        <div class="pt-1">
          <span class="block text-xs text-gray-400 text-center mb-2">Save to personal schedule:</span>
          <div id="exportLinksContainer" class="grid grid-cols-2 gap-2 text-center"></div>
        </div>
      </div>
      
      <div class="flex gap-2 mt-1">
        <button id="backToDayBtn" onclick="backToDayModal()" class="w-1/2 bg-gray-700 hover:bg-gray-600 text-gray-200 py-2 rounded-lg text-xs sm:text-sm transition">
          &larr; Back to Day
        </button>
        <button onclick="closeModal('eventModal')" class="w-1/2 bg-gray-600 hover:bg-gray-500 text-gray-200 py-2 rounded-lg text-xs sm:text-sm transition">
          Close
        </button>
      </div>
    </div>
  </div>

  <!-- CREATE EVENT MODAL -->
  <div id="createModal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-3 z-50">
    <div class="bg-gray-800 p-5 rounded-xl max-w-md w-full border border-gray-700 shadow-xl space-y-4">
      <h2 class="text-lg sm:text-xl font-bold text-white">Schedule New Event</h2>
      
      <form id="createEventForm" onsubmit="handleCreateEvent(event)" class="space-y-3">
        <div>
          <label class="block text-xs text-gray-400 mb-1">Event Title</label>
          <input type="text" id="eventTitle" required class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-sm text-white focus:outline-none focus:border-indigo-500">
        </div>
        
        <div>
          <label class="block text-xs text-gray-400 mb-1">Description</label>
          <textarea id="eventDesc" rows="2" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-sm text-white focus:outline-none focus:border-indigo-500"></textarea>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs text-gray-400 mb-1">Start Time</label>
            <input type="datetime-local" id="startTime" required class="w-full bg-gray-900 border border-gray-700 rounded p-1.5 text-xs text-white focus:outline-none focus:border-indigo-500">
          </div>
          <div>
            <label class="block text-xs text-gray-400 mb-1">End Time</label>
            <input type="datetime-local" id="endTime" required class="w-full bg-gray-900 border border-gray-700 rounded p-1.5 text-xs text-white focus:outline-none focus:border-indigo-500">
          </div>
        </div>

        <div>
          <label class="block text-xs text-gray-400 mb-1">Location / Channel Link</label>
          <input type="text" id="eventLocation" placeholder="e.g. #general or Voice Channel" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-sm text-white focus:outline-none focus:border-indigo-500">
        </div>

        <div class="flex gap-2 pt-2">
          <button type="button" onclick="closeModal('createModal')" class="w-1/2 bg-gray-700 hover:bg-gray-600 text-gray-200 py-2 rounded-lg text-xs sm:text-sm">Cancel</button>
          <button type="submit" id="submitEventBtn" class="w-1/2 bg-indigo-600 hover:bg-indigo-500 text-white py-2 rounded-lg text-xs sm:text-sm font-semibold">Publish to Discord</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let calendar;
    let selectedDateStr = '';
    let currentDayEvents = [];

    document.addEventListener('DOMContentLoaded', function() {
      const calendarEl = document.getElementById('calendar');
      
      calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        height: 'auto',
        dayMaxEvents: true,
        headerToolbar: {
          left: 'prev,next',
          center: 'title',
          right: 'today'
        },
        selectable: true,

        // Direct fetch wrapper to eliminate extra query parameters
        events: function(fetchInfo, successCallback, failureCallback) {
          fetch(API_BASE_URL)
            .then(response => {
              if (!response.ok) throw new Error('API response failed');
              return response.json();
            })
            .then(data => successCallback(data))
            .catch(error => {
              console.error("Error loading events:", error);
              failureCallback(error);
            });
        },

        dateClick: function(info) {
          openDayModal(info.dateStr);
        },
        
        eventClick: function(info) {
          info.jsEvent.preventDefault();
          const eventDateStr = info.event.start.toISOString().split('T')[0];
          openDayModal(eventDateStr);
        }
      });
      
      calendar.render();
    });

    function openDayModal(dateStr) {
      selectedDateStr = dateStr;
      
      const parts = dateStr.split('-');
      const localDate = new Date(parts[0], parts[1] - 1, parts[2]);
      const formattedDate = localDate.toLocaleDateString(undefined, { 
        weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' 
      });
      document.getElementById('dayModalTitle').innerText = formattedDate;

      const allEvents = calendar.getEvents();
      currentDayEvents = allEvents.filter(ev => {
        if (!ev.start) return false;
        const evYear = ev.start.getFullYear();
        const evMonth = String(ev.start.getMonth() + 1).padStart(2, '0');
        const evDay = String(ev.start.getDate()).padStart(2, '0');
        return `${evYear}-${evMonth}-${evDay}` === dateStr;
      });

      const listContainer = document.getElementById('dayEventsList');
      if (currentDayEvents.length === 0) {
        listContainer.innerHTML = `<p class="text-gray-400 text-xs italic py-3 text-center">No events scheduled for this day.</p>`;
      } else {
        listContainer.innerHTML = currentDayEvents.map((ev, index) => {
          const timeStr = ev.start.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          return `
            <div onclick="selectEventFromDay(${index})" class="bg-gray-900 hover:bg-gray-700/80 p-3 rounded-lg border border-gray-700 cursor-pointer transition flex justify-between items-center">
              <div>
                <p class="text-sm font-semibold text-white">${ev.title}</p>
                <p class="text-xs text-indigo-400">${ev.extendedProps.location || 'Discord'}</p>
              </div>
              <span class="text-xs text-gray-400 font-mono bg-gray-800 px-2 py-1 rounded border border-gray-700">${timeStr}</span>
            </div>
          `;
        }).join('');
      }

      document.getElementById('dayModal').classList.remove('hidden');
    }

    function selectEventFromDay(index) {
      closeModal('dayModal');
      showEventDetails(currentDayEvents[index], true);
    }

    function backToDayModal() {
      closeModal('eventModal');
      document.getElementById('dayModal').classList.remove('hidden');
    }

    function openCreateModalFromDay() {
      closeModal('dayModal');
      document.getElementById('startTime').value = `${selectedDateStr}T12:00`;
      document.getElementById('endTime').value = `${selectedDateStr}T13:00`;
      openCreateModal();
    }

    function parseDiscordMarkdown(text) {
      if (!text) return 'No description provided.';

      return text
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/(\*|_)(.*?)\1/g, '<em>$2</em>')
        .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer" class="text-indigo-400 underline hover:text-indigo-300">$1</a>')
        .replace(/<(https?:\/\/[^>]+)>/g, '<a href="$1" target="_blank" rel="noopener noreferrer" class="text-indigo-400 underline hover:text-indigo-300">$1</a>')
        .replace(/(^|[^"])(https?:\/\/[^\s<]+)/g, '$1<a href="$2" target="_blank" rel="noopener noreferrer" class="text-indigo-400 underline hover:text-indigo-300">$2</a>');
    }

    function showEventDetails(event, fromDayModal = false) {
      document.getElementById('modalTitle').innerText = event.title;
      document.getElementById('modalLocation').innerText = event.extendedProps.location;

      const rawDesc = event.extendedProps.description || '';
      document.getElementById('modalDescription').innerHTML = parseDiscordMarkdown(rawDesc);

      const rsvpUrl = event.extendedProps.rsvpUrl || '';
      const rsvpBtn = document.getElementById('rsvpBtn');
      
      rsvpBtn.onclick = function() {
        if (!rsvpUrl) return;
        
        const match = rsvpUrl.match(/discord\.com\/events\/(\d+)\/(\d+)/);
        if (match) {
          const guildId = match[1];
          const eventId = match[2];
          const appUri = `discord://discord.com/events/${guildId}/${eventId}`;
          
          const iframe = document.createElement('iframe');
          iframe.style.display = 'none';
          iframe.src = appUri;
          document.body.appendChild(iframe);
          
          setTimeout(() => {
            document.body.removeChild(iframe);
            window.open(rsvpUrl, '_blank', 'noopener,noreferrer');
          }, 500);
        } else {
          window.open(rsvpUrl, '_blank', 'noopener,noreferrer');
        }
      };

      const startDate = event.start ? event.start.toISOString().replace(/-|:|\.\d\d\d/g, "") : '';
      const endDate = event.end ? event.end.toISOString().replace(/-|:|\.\d\d\d/g, "") : startDate;
      const title = encodeURIComponent(event.title);
      const desc = encodeURIComponent(rawDesc);
      const loc = encodeURIComponent(event.extendedProps.location);

      const googleCalUrl = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${startDate}/${endDate}&details=${desc}&location=${loc}`;
      const icsData = `BEGIN:VCALENDAR\nVERSION:2.0\nBEGIN:VEVENT\nSUMMARY:${event.title}\nDESCRIPTION:${rawDesc.replace(/\n/g, '\\n')}\nLOCATION:${event.extendedProps.location}\nDTSTART:${startDate}\nDTEND:${endDate}\nEND:VEVENT\nEND:VCALENDAR`;
      const icsBlobUrl = `data:text/calendar;charset=utf8,${encodeURIComponent(icsData)}`;

      const exportContainer = document.getElementById('exportLinksContainer');
      exportContainer.innerHTML = `
        <a href="${googleCalUrl}" target="_blank" rel="noopener noreferrer" class="bg-gray-700 hover:bg-gray-600 text-xs py-2 px-2 rounded text-indigo-300 font-medium border border-gray-600">
          + Google
        </a>
        <a href="${icsBlobUrl}" download="${event.title.replace(/\s+/g, '_')}.ics" class="bg-gray-700 hover:bg-gray-600 text-xs py-2 px-2 rounded text-indigo-300 font-medium border border-gray-600">
          + Apple / iCal
        </a>
      `;

      const backBtn = document.getElementById('backToDayBtn');
      if (fromDayModal) {
        backBtn.classList.remove('hidden');
      } else {
        backBtn.classList.add('hidden');
      }

      document.getElementById('eventModal').classList.remove('hidden');
    }

    async function handleCreateEvent(e) {
      e.preventDefault();
      
      const submitBtn = document.getElementById('submitEventBtn');
      submitBtn.disabled = true;
      submitBtn.innerText = "Publishing...";

      const startTimeRaw = document.getElementById('startTime').value;
      const endTimeRaw = document.getElementById('endTime').value;

      const payload = {
        name: document.getElementById('eventTitle').value,
        description: document.getElementById('eventDesc').value || '',
        startTime: new Date(startTimeRaw).toISOString(),
        endTime: new Date(endTimeRaw).toISOString(),
        location: document.getElementById('eventLocation').value || 'Discord Voice/Text'
      };

      try {
        const res = await fetch(API_BASE_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          closeModal('createModal');
          calendar.refetchEvents();
          document.getElementById('createEventForm').reset();
        } else {
          const errData = await res.json().catch(() => ({}));
          alert(`Error publishing event: ${errData.error || 'Check backend logs'}`);
        }
      } catch (err) {
        alert('Network error reaching backend.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "Publish to Discord";
      }
    }

    function openCreateModal() { document.getElementById('createModal').classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
  </script>
</body>
</html>
